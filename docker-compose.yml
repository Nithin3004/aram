services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aram
      POSTGRES_PASSWORD: aram
      POSTGRES_DB: aram
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aram
      MINIO_ROOT_PASSWORD: aramsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
