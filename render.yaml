# Render blueprint for the API (free plan).
# Secrets marked `sync: false` are entered by you in the Render dashboard — never committed.
services:
  - type: web
    name: aram-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    # Live data lives in its own Postgres schema (DB_SCHEMA), apart from the earlier preview sample.
    # On first deploy the live schema is created and loaded from data-import/live (the HO workbook);
    # later deploys leave existing data untouched (--if-empty).
    buildCommand: >-
      npm install -g pnpm@9.15.9 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @aram/shared build &&
      cd apps/api &&
      npx prisma generate &&
      node scripts/db-env.cjs npx prisma migrate deploy &&
      node scripts/db-env.cjs npx ts-node --transpile-only prisma/import.ts ../../data-import/live --if-empty &&
      node scripts/db-env.cjs npx ts-node --transpile-only prisma/backfill-tamil.ts &&
      npx nest build
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SCHEMA
        value: live
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Starting passwords for the accounts created on first load (admin + every shop).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_SHOP_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: console
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: aram-photos
